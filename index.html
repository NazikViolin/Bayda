  --bg:#2E0F17; --bg-rgb:46,15,23; --ink:#FBEFE3; --muted:#D6B7AC; --line:rgba(232,184,75,.4);
  --gold:#E8B84B; --box:rgba(46,15,23,.94);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh}
.hero{display:block}
.photo{position:relative;width:100%;max-width:620px;margin:0 auto;height:auto;aspect-ratio:900/670;background:var(--img) center/100% 100% no-repeat}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(var(--bg-rgb),0) 82%,var(--bg) 100%)}
.hero-in{position:relative;z-index:1;width:100%;max-width:420px;margin:-6px auto 0;padding:0 20px 18px;text-align:center}
h1{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:700;font-size:clamp(32px,10vw,42px);line-height:1.1;margin:0;letter-spacing:-.01em}
.band{height:36px;background:var(--band) repeat-x center;background-size:28px 28px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);opacity:.95}
.wrap{position:relative;overflow:hidden}
.wrap::before{content:"";position:absolute;inset:0;background:var(--pat);background-size:55px 55px;opacity:.3;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 140px);mask-image:linear-gradient(to bottom,transparent,#000 140px)}
main{position:relative;z-index:1;width:100%;max-width:420px;margin:0 auto;padding:26px 20px 28px}
.box{background:var(--box);border:1px solid var(--line);border-bottom:6px solid var(--gold);border-radius:20px;padding:20px 22px}
.label{font-size:14px;color:var(--muted);margin:0 0 6px}
.num{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:500;font-size:clamp(14px,4.6vw,24px);font-size:min(24px,5.8cqw);letter-spacing:.02em;margin:0 0 14px;font-variant-numeric:tabular-nums;word-spacing:.1em;white-space:nowrap}
section.box{container-type:inline-size}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.holder{font-size:15px}
button{font:inherit;font-weight:600;font-size:15px;cursor:pointer;border:0;background:var(--gold);color:#2E0F17;border-radius:999px;padding:10px 18px;min-height:44px}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.qr{margin-top:24px;text-align:center}
.tile{display:inline-block;background:#fff;padding:16px;border-radius:16px;border:4px solid var(--gold)}
#qrcode img,#qrcode canvas{display:block;max-width:100%;height:auto}
.qr p{margin:14px 0 0;color:var(--ink);font-size:15px;text-shadow:0 1px 6px var(--bg)}
.call{margin-top:24px}
h2{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:700;font-size:17px;margin:0 0 4px}
.sub{margin:0 0 8px;color:var(--muted);font-size:15px}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;min-height:48px;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.nm{font-weight:600;font-size:17px}
.ph{background:var(--gold);color:#2E0F17;border-radius:999px;padding:9px 16px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.thanks{margin:28px 0 0;text-align:center;color:var(--ink);font-size:14px}
</style>
</head>
<body>
<header class="hero">
  <div class="photo" role="img" aria-label="Тріо «Байда» з інструментами"></div>
  <div class="hero-in"><h1>Тріо «Байда»</h1></div>
</header>
<div class="band" aria-hidden="true"></div>

<div class="wrap">
<main>
  <section class="box" aria-label="Реквізити картки">
    <p class="label">Номер картки</p>
    <p class="num" id="num"></p>
    <div class="row">
      <span class="holder" id="holder"></span>
      <button id="copy" type="button">Скопіювати</button>
    </div>
  </section>

  <section class="qr" aria-label="QR-код для переказу">
    <div class="tile"><div id="qrcode"></div></div>
    <p>Скануйте QR-код камерою або в додатку банку</p>
  </section>

  <section class="box call" aria-label="Контакти">
    <h2>Запросити на виступ</h2>
    <p class="sub">Телефонуйте, домовимось.</p>
    <a class="who" href="tel:+380674464820"><span class="nm">Юрій</span><span class="ph">067 446 48 20</span></a>
    <a class="who" href="tel:+380672613249"><span class="nm">Микола</span><span class="ph">067 261 32 49</span></a>
    <a class="who" href="tel:+380663449202"><span class="nm">Назар</span><span class="ph">066 344 92 02</span></a>
  </section>

  <p class="thanks">Дякуємо, що слухаєте!</p>
</main>
</div>
<div class="band" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var CFG = { holder: "Єгоров Юрій", card: "5363542091394982", link: "https://www.privat24.ua/send/kpcg7" };
var digits = CFG.card.replace(/\s+/g, "");
document.getElementById("holder").textContent = CFG.holder;
document.getElementById("num").textContent = digits.replace(/(\d{4})(?=\d)/g, "$1 ");
try {
  new QRCode(document.getElementById("qrcode"), { text: CFG.link || digits, width: 220, height: 220, colorDark: "#2E0F17", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M });
} catch (e) { document.getElementById("qrcode").textContent = "QR-код недоступний"; }
var btn = document.getElementById("copy");
btn.addEventListener("click", function () {
  function done() { btn.textContent = "Скопійовано"; setTimeout(function () { btn.textContent = "Скопіювати"; }, 1800); }
  function fallback() {
    try { var t = document.createElement("textarea"); t.value = digits; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); done(); }
    catch (e) { btn.textContent = "Скопіюйте вручну"; }
  }
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(digits).then(done, fallback); } else { fallback(); } }
  catch (e) { fallback(); }
});
</script>
</body>
</html>
